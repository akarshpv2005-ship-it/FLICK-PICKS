{% extends 'User/userHome.html' %}
{% load static %}

{% for m in messages %}
<script>
    alert('{{ m }}');
</script>
{% endfor %}

{% block content %}
<br>
<br>
<br>
<br>
<br>
<br>
<div class="box">

    {% if data %}
        {% for movie in data %}
            <a href="{{ movie.movie_link }}" target="_blank">
                <img src="../../static/media/{{ movie.image }}" alt="{{ movie.image}}">
            </a>
        {% endfor %}
    {% else %}
        <p style="color:white;text-align:center;">No movies available</p>
    {% endif %}

</div>

<style>
    img{
        width: 300px;
        height: auto;
        margin: 5px;
        border: 6px double white;
    }   

    .box{
        box-shadow: 0 0 20px 2px rgba(0,0,0,0.1);
        transition: 1s;
        text-align: center;
    }

    .box img:hover{
        transform: scale(1.1);
        z-index: 2;
    }
</style>

{% endblock %}
